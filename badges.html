    <style>

        body {
            background-color: #2c2f33;
            color: #ffffff;
            font-family: "Open Sans", Arial, Verdana, sans-serif;
        }
        .c-pill {
        align-items: center;
            font-family: "Open Sans", Arial, Verdana, sans-serif;
            font-size: 11px;
        display: inline-block;
        height: 100%;
        white-space: nowrap;
        width: auto;
         background: #2dd3fd;

        position: relative;
        background-color: #000000;
        border-radius: 100px;
        border: 1px solid #ffff;
        line-height: 1;
        overflow: hidden;
        padding: 0px 12px 0px 20px;
        text-overflow: ellipsis;
            line-height: 1.25rem;
            color: #ffffff;
            
            word-break: break-word;

        &:before {
            border-radius: 50%;
            background: #2dd3fd;
            content: '';
            height: 10px;
            left: 6px;
            margin-top: -5px;
            position: absolute;
            top: 50%;
            width: 10px;
        }
        
        
        }


    </style>

</head>
